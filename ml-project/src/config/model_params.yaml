model:
  name: efficientnet_b0
  pretrained: true
  freeze_backbone: true

training:
  epochs: 10
  batch_size: 16
  learning_rate: 0.001
  device: cpu   # change to cuda later if available

optimizer:
  type: adam
  weight_decay: 0.0001

loss:
  type: cross_entropy

evaluation:
  metrics:
    - accuracy
